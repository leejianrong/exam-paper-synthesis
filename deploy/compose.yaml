# Production stack for one small droplet (EXA-E16; ADR-0024 to follow): Caddy (TLS) → app → Postgres 17.
#   cp .env.example .env   # fill it in (see docs/LAUNCH.md)
#   docker compose up -d
# Only Caddy publishes ports; the app and the database are reachable on the stack's network only.
# Memory is budgeted for a 1 GB droplet with 2 GB swap, one PDF render at a time: app 768 MB
# (the API ~70-150 MB, one Chromium ~370 MB at its peak), Postgres 256 MB, Caddy and backups
# 128 MB each; the limits are caps, not reservations. Chromium's /dev/shm use counts against the
# app's limit, and each container may also swap up to its own limit. On a 2 GB droplet, raise
# them in .env (the values are in .env.example).

name: exam

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

  app:
    image: ${APP_IMAGE:-ghcr.io/leejianrong/exam-paper-synthesis}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      EXAM_DATABASE_URL: postgresql://exam:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/exam
      EXAM_PUBLIC_URL: ${EXAM_PUBLIC_URL:?set EXAM_PUBLIC_URL in .env}
      EXAM_WEB_URL: ${EXAM_WEB_URL:?set EXAM_WEB_URL in .env}
      EXAM_OAUTH_GOOGLE_CLIENT_ID: ${EXAM_OAUTH_GOOGLE_CLIENT_ID:-}
      EXAM_OAUTH_GOOGLE_CLIENT_SECRET: ${EXAM_OAUTH_GOOGLE_CLIENT_SECRET:-}
      EXAM_OAUTH_GITHUB_CLIENT_ID: ${EXAM_OAUTH_GITHUB_CLIENT_ID:-}
      EXAM_OAUTH_GITHUB_CLIENT_SECRET: ${EXAM_OAUTH_GITHUB_CLIENT_SECRET:-}
      EXAM_OAUTH_MICROSOFT_CLIENT_ID: ${EXAM_OAUTH_MICROSOFT_CLIENT_ID:-}
      EXAM_OAUTH_MICROSOFT_CLIENT_SECRET: ${EXAM_OAUTH_MICROSOFT_CLIENT_SECRET:-}
      EXAM_ALLOWED_EMAILS: ${EXAM_ALLOWED_EMAILS:-}
      EXAM_CONTACT_EMAIL: ${EXAM_CONTACT_EMAIL:-}
      EXAM_EXPORT_CONCURRENCY: ${EXAM_EXPORT_CONCURRENCY:-1}
      EXAM_EXPORT_TIMEOUT_MS: ${EXAM_EXPORT_TIMEOUT_MS:-30000}
      # Caddy replaces any X-Forwarded-For a client sends, and uvicorn (--proxy-headers) turns it
      # into the client address, so the per-address sign-in limits see the real visitor.
      # That holds for IPv4 only: Docker proxies IPv6 clients from the bridge gateway, so give
      # the domain no AAAA record unless the stack's network has IPv6 enabled.
    expose:
      - "8080"
    # Chromium needs more than Docker's 64 MB /dev/shm for multi-page papers.
    shm_size: ${APP_SHM_SIZE:-256m}
    mem_limit: ${APP_MEM_LIMIT:-768m}
    # Stated here too: an image built in OCI format (podman's default) drops the Dockerfile's.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_DB: exam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Sized for a small box shared with Chromium; the app's pool holds at most 5 connections.
    command: ["postgres", "-c", "shared_buffers=${DB_SHARED_BUFFERS:-64MB}", "-c", "max_connections=25"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first boot the init server listens on the socket only, then restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U exam -d exam"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: ${DB_MEM_LIMIT:-256m}

  # Nightly pg_dump to a DigitalOcean Spaces bucket; dumps older than 14 days are deleted
  # (docs/deploy/BACKUPS.md). Back up now: docker compose exec backup exam-backup now
  # Empty SPACES_* values don't block other compose commands: the job refuses to start and
  # says so in `docker compose logs backup`.
  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: exam
      PGDATABASE: exam
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      BACKUP_PATH: ${BACKUP_PATH:-db}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      RCLONE_CONFIG_SPACES_TYPE: s3
      RCLONE_CONFIG_SPACES_PROVIDER: DigitalOcean
      RCLONE_CONFIG_SPACES_ENDPOINT: ${SPACES_ENDPOINT:-https://sgp1.digitaloceanspaces.com}
      RCLONE_CONFIG_SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # Lets a dump in progress finish when the service is stopped.
    stop_grace_period: 2m
    mem_limit: 128m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
