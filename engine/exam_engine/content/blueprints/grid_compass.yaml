code: grid_compass
# EXA-144: a 1-mark Booklet A question on the 8-point compass; the options are place letters,
# so the blueprint asks multiple choice itself. No difficulty ladder.
syllabus:
  level: P5
  strand: "Geometry"
  topic: "Square Grids"
  subtopic: "8-point compass directions and turns on a grid"
  skill_codes: ["GRID.COMPASS"]         # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: easy
  cognitive_level: routine_procedural
  difficulty_levers: ["Representation translation"]
marks: 1
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [o, ask, start, angle, clockwise, name, options, letters]
  properties:
    o: { $ref: "#/$defs/point" }
    ask: { type: string, enum: [direction, turn] }
    # the direction asked for, or the one faced before the turn: 0 = north, clockwise in 45s
    start: { type: integer, minimum: 0, maximum: 7 }
    angle: { type: integer, enum: [0, 90, 135, 225, 270] }
    clockwise: { type: boolean }
    name: { type: string, minLength: 1 }
    # the four lettered places, the correct one first
    options: { type: array, minItems: 4, maxItems: 4, items: { $ref: "#/$defs/point" } }
    letters: { type: string, pattern: "^[A-D]{4}$" }
  $defs:
    point:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: integer, minimum: 0, maximum: 8 }
param_roles:
  o:         { role: number }
  ask:       { role: choice }
  start:     { role: choice }
  angle:     { role: number }
  clockwise: { role: choice }
  name:      { role: choice }
  options:   { role: number }
  letters:   { role: choice }
story_templates:
  - stem: null
    text: "The square grid shows a point O and four places A, B, C and D. {question}"
solution_template:
  steps:
    - text: "{step1}"
      expr: null
    - text: "{step2}"
      expr: null
marking_scheme:
  - { mark: 1, type: A, description: "Correct place." }
answer:
  type: choice
diagram: grid
