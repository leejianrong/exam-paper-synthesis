code: average_easy
syllabus:
  level: P5
  strand: "Data Analysis"
  topic: "Average"
  subtopic: "Average of a set of whole numbers"
  skill_codes: ["AVG.OF.SET"]           # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: easy
  cognitive_level: routine_procedural
  difficulty_levers: ["Reasoning depth"]
marks: 1
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [name, values, template]
  properties:
    name:
      type: string
    values:
      type: array
      items: { type: integer, minimum: 1, maximum: 60 }
      minItems: 3
      maxItems: 5
    template: { type: string, enum: [tests, pages, savings] }
# Every parameter_schema property needs a role (W1a). name|item = cosmetic (teacher-editable,
# never enters solve()); number|choice drive the maths and are not cosmetically editable.
param_roles:
  name:     { role: name }
  values:   { role: number }
  template: { role: choice }
# The solver builds the number-bearing fragments s1/s2; the name is interleaved here only.
story_templates:
  - stem: null
    text: "{name}{s1}{name}{s2}"
solution_template:
  steps:
    - text: "{step1}"
    - text: "{step2}"
marking_scheme:
  - { mark: 1, type: A, description: "Correct average (total ÷ number of items)." }
answer:
  type: integer
  unit: ""
