code: ratio_difference
syllabus:
  level: P5
  strand: "Ratio"
  topic: "Ratio"
  subtopic: "The difference in units: find the total from a ratio and a difference"
  skill_codes: ["RATIO.DIFF.2TERM"]     # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: medium
  cognitive_level: complex_familiar
  difficulty_levers: ["Reasoning depth", "Hidden structure"]
marks: 2
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [names, item, ratio, difference]
  properties:
    names:
      type: array
      items: { type: string }
      minItems: 2
      maxItems: 2
    item:
      type: string
    ratio:
      type: array
      items: { type: integer, minimum: 1, maximum: 9 }
      minItems: 2
      maxItems: 2
    difference:
      type: integer
      minimum: 3
      maximum: 320
# Every parameter_schema property needs a role (W1a). name|item = cosmetic (teacher-editable,
# never enters solve()); number|choice drive the maths and are not cosmetically editable.
param_roles:
  names:      { role: name }
  item:       { role: item }
  ratio:      { role: number }
  difference: { role: number }
story_templates:
  - stem: null
    text: >
      The ratio of the number of {item} {names[0]} has to the number of {item}
      {names[1]} has is {ratio[0]} : {ratio[1]}. {names[0]} has {difference}
      {more_fewer} {item} than {names[1]}. How many {item} do they have altogether?
solution_template:
  steps:
    - text: "{step1}"
      expr: "{difference}/{diff_units}"
    - text: "Altogether = {ratio[0]} + {ratio[1]} = {units_total} units = {units_total} × {unit_value} = {total}."
      expr: "{units_total}*{unit_value}"
marking_scheme:
  - { mark: 1, type: M, description: "Find the value of 1 unit from the difference in units." }
  - { mark: 1, type: A, description: "Correct total number." }
answer:
  type: integer
  unit: ""
