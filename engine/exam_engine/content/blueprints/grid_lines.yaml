code: grid_lines
# EXA-144: a 1-mark Booklet A question; the options are point letters, so the blueprint asks
# multiple choice itself. No difficulty ladder.
syllabus:
  level: P5
  strand: "Geometry"
  topic: "Square Grids"
  subtopic: "Parallel and perpendicular lines on a grid"
  skill_codes: ["GRID.LINES"]           # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: easy
  cognitive_level: routine_procedural
  difficulty_levers: ["Representation translation"]
marks: 1
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [a, b, c, ask, options, letters]
  properties:
    a: { $ref: "#/$defs/point" }
    b: { $ref: "#/$defs/point" }
    c: { $ref: "#/$defs/point" }
    ask: { type: string, enum: [parallel, perpendicular] }
    # the four lettered points, the correct one first
    options: { type: array, minItems: 4, maxItems: 4, items: { $ref: "#/$defs/point" } }
    letters: { type: string, pattern: "^[P-S]{4}$" }
  $defs:
    point:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: integer, minimum: 0, maximum: 10 }
param_roles:
  a:       { role: number }
  b:       { role: number }
  c:       { role: number }
  ask:     { role: choice }
  options: { role: number }
  letters: { role: choice }
story_templates:
  - stem: null
    text: "The figure shows line AB and points C, P, Q, R and S on a square grid. Which point, when joined to C, gives a line {ask} to AB?"
solution_template:
  steps:
    - text: "{step1}"
      expr: null
    - text: "{step2}"
      expr: null
    - text: "{step3}"
      expr: null
marking_scheme:
  - { mark: 1, type: A, description: "Correct point." }
answer:
  type: choice
diagram: grid
