code: geometry_angle_composite
syllabus:
  level: P6
  strand: "Geometry"
  topic: "Geometry (Angles)"
  subtopic: "Composite figure: rhombus, parallelogram or trapezium with an isosceles or equilateral triangle"
  skill_codes: ["GEO.ANG.COMPOSITE"]    # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: hard
  cognitive_level: non_routine_heuristic
  difficulty_levers: ["Hidden structure", "Reasoning depth", "Multiple concepts"]
marks: 3
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [template, givens, angles]
  properties:
    template:
      type: string
      enum: ["rhombus_equilateral", "parallelogram_isosceles", "trapezium_isosceles"]
    givens:
      type: object
      additionalProperties:
        type: integer
    angles:                             # given-angle contract map (see check docstring)
      type: object
      additionalProperties:
        type: integer
param_roles:
  template: { role: choice }
  givens:   { role: number }
  angles:   { role: number }
story_templates:
  - stem: null
    text: "{question_text}"
solution_template:
  steps:
    - text: "{step1}"
    - text: "{step2}"
    - text: "{step3}"
marking_scheme:
  - { mark: 1, type: M, description: "Finds the equal sides and so the isosceles triangle." }
  - { mark: 1, type: M, description: "Uses the quadrilateral's angle property (opposite, alternate or adjacent angles)." }
  - { mark: 1, type: A, description: "Correct unknown angle in degrees." }
answer:
  type: integer
  unit: "degrees"
diagram: geometry_figure
