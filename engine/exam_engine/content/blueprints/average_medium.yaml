code: average_medium
syllabus:
  level: P5
  strand: "Data Analysis"
  topic: "Average"
  subtopic: "Total from an average; a missing value given the average"
  skill_codes: ["AVG.TOTAL", "AVG.MISSING"]   # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: medium
  cognitive_level: complex_familiar
  difficulty_levers: ["Reasoning depth", "Direction"]
marks: 2
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [name, kind, n, average, given]
  properties:
    name:
      type: string
    kind: { type: string, enum: [missing, total] }
    n: { type: integer, minimum: 3, maximum: 8 }
    average: { type: integer, minimum: 5, maximum: 20 }
    # missing: the first n - 1 test scores; total: [amount spent, in $]
    given:
      type: array
      items: { type: integer, minimum: 1, maximum: 200 }
      minItems: 1
      maxItems: 4
# Every parameter_schema property needs a role (W1a). name|item = cosmetic (teacher-editable,
# never enters solve()); number|choice drive the maths and are not cosmetically editable.
param_roles:
  name:    { role: name }
  kind:    { role: choice }
  n:       { role: number }
  average: { role: number }
  given:   { role: number }
# The solver builds the number-bearing fragments s1..s3; the name is interleaved here only.
story_templates:
  - stem: null
    text: "{name}{s1} {name}{s2} {name}{s3}"
solution_template:
  steps:
    - text: "{step1}"
    - text: "{step2}"
marking_scheme:
  - { mark: 1, type: M, description: "Total = average × number of items." }
  - { mark: 1, type: A, description: "Correct missing score (or amount left, with the $ unit)." }
answer:
  type: integer
  unit: ""
