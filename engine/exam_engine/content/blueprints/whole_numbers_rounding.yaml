code: whole_numbers_rounding
# P8e batch 3 (EXA-145): a 1-mark Booklet A question, not on the whole_numbers ladder.
syllabus:
  level: P5                             # rounding is first taught in P4; PSLE assumes it
  strand: "Number and Algebra"
  topic: "Whole Numbers"
  subtopic: "Rounding to the nearest ten, hundred or thousand"
  skill_codes: ["WN.ROUND"]             # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: easy
  cognitive_level: routine_procedural
  difficulty_levers: ["Answer form"]
marks: 1
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [number, place]
  properties:
    number: { type: integer, minimum: 1001, maximum: 9999 }
    place: { type: integer, enum: [10, 100, 1000] }
# Every parameter_schema property needs a role (W1a). name|item = cosmetic (teacher-editable,
# never enters solve()); number|choice drive the maths and are not cosmetically editable.
param_roles:
  number: { role: number }
  place:  { role: choice }
story_templates:
  - stem: null
    text: "Round {number} to the nearest {place_name}."
solution_template:
  steps:
    - text: "{step1}"
      expr: null
    - text: "{step2}"
      expr: null
marking_scheme:
  - { mark: 1, type: A, description: "Correct number, rounded to the place asked for." }
answer:
  type: integer
  unit: ""
