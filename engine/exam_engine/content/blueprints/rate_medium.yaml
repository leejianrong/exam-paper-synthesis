code: rate_medium
syllabus:
  level: P5
  strand: "Number and Algebra"
  topic: "Rate"
  subtopic: "Finding the rate per unit, then an amount or a time"
  skill_codes: ["RATE.UNITARY"]         # PROVISIONAL — remap to MOE outcomes (Q-M1)
cognitive:
  difficulty: medium
  cognitive_level: complex_familiar
  difficulty_levers: ["Reasoning depth", "Direction"]
marks: 2
parameter_schema:                       # ADR-0014: sampled params validate against this
  type: object
  additionalProperties: false
  required: [name, template, kind, rate, t1, t2]
  properties:
    name:
      type: string
    template: { type: string, enum: [baker, cranes, printer, typing] }
    kind: { type: string, enum: [amount, time] }       # what is asked for
    rate: { type: integer, minimum: 8, maximum: 60 }   # items per unit of time (not printed)
    t1: { type: integer, minimum: 2, maximum: 9 }      # time in the given fact
    t2: { type: integer, minimum: 2, maximum: 12 }     # time asked about / the time answer
# Every parameter_schema property needs a role (W1a). name|item = cosmetic (teacher-editable,
# never enters solve()); number|choice drive the maths and are not cosmetically editable.
param_roles:
  name:     { role: name }
  template: { role: choice }
  kind:     { role: choice }
  rate:     { role: number }
  t1:       { role: number }
  t2:       { role: number }
# The solver builds the number-bearing fragments s1/s2; the name is interleaved here only.
story_templates:
  - stem: null
    text: "{name}{s1}{name}{s2}"
solution_template:
  steps:
    - text: "{step1}"
      expr: "{expr1}"
    - text: "{step2}"
      expr: "{expr2}"
marking_scheme:
  - { mark: 1, type: M, description: "Amount in 1 unit of time = given amount ÷ given time." }
  - { mark: 1, type: A, description: "Correct amount (or time, with the unit)." }
answer:
  type: integer
  unit: ""
