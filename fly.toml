# Fly.io (ADR-0022). Secrets (never in this file): EXAM_DATABASE_URL (Neon),
# EXAM_OAUTH_{GOOGLE,MICROSOFT,GITHUB}_CLIENT_ID / _CLIENT_SECRET — `fly secrets set …`.
# See docs/LAUNCH.md.
app = "exam-paper-synthesis"
primary_region = "sin"

[build]

[env]
  EXAM_PUBLIC_URL = "https://exam-paper-synthesis.fly.dev"
  EXAM_WEB_URL = "https://exam-paper-synthesis.fly.dev"
  # Fly overwrites this header, so the per-address /auth limits see the real client.
  EXAM_CLIENT_IP_HEADER = "Fly-Client-IP"
  EXAM_EXPORT_CONCURRENCY = "2"
  EXAM_EXPORT_TIMEOUT_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/ready"

[[vm]]
  # Headless Chromium for PDFs needs headroom.
  size = "shared-cpu-2x"
  memory = "2gb"
