name: Image

# Builds the production image (Dockerfile) and checks that its browser prints a paper
# (deploy/image_smoke.py). On main a second job pushes it to GHCR for the droplet (EXA-E16):
# ghcr.io/<repo>:sha-<commit> and :latest. Pull requests build and test only, with a read-only
# token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # Never cancel a main run: every merge's :sha-<commit> tag must exist to roll back to.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: exam-paper-synthesis:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (print a paper with the image's browser)
        run: |
          docker run --rm -i exam-paper-synthesis:smoke uv run --no-sync python - < deploy/image_smoke.py
          docker image ls exam-paper-synthesis:smoke

  publish:
    needs: build
    # Only main publishes (a manual run on another branch builds and tests, nothing more).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (from the build job's cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
